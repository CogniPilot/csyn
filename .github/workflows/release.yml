name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  crates-io:
    name: Publish Rust crate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vMAJOR.MINOR.PATCH, got ${tag}"
            exit 1
          fi

          crate_version="$(python3 -c 'import tomllib; from pathlib import Path; data = tomllib.loads(Path("rust/Cargo.toml").read_text()); print(data["package"]["version"])')"
          tag_version="${tag#v}"

          if [[ "${crate_version}" != "${tag_version}" ]]; then
            echo "::error::Tag ${tag} does not match rust/Cargo.toml version ${crate_version}"
            exit 1
          fi
      - name: Rust checks
        run: make check-rust
      - name: Package dry run
        run: cargo publish --locked --dry-run --manifest-path rust/Cargo.toml
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --manifest-path rust/Cargo.toml --token "$CRATES_IO_TOKEN"
