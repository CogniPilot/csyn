# All jobs run on plain GitHub runners with no hardware. The Zephyr job builds
# and runs Twister on native_sim only. The Zephyr and Rust jobs need the pinned
# synapse_fbs release published before they can pass.
name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Host checks
        run: make fmt lint-rust test-rust

  zephyr:
    name: Zephyr module
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: modules/lib/csyn
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ccache cmake device-tree-compiler file g++-multilib gcc-multilib git gperf make ninja-build python3-dev python3-pip python3-venv
      - name: Set up Zephyr workspace
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r modules/lib/csyn/.github/requirements-zephyr.txt
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          mkdir -p .west
          git config --file .west/config manifest.path modules/lib/csyn
          git config --file .west/config manifest.file west.yml
          git config --file .west/config zephyr.base zephyr
      - name: Update west projects
        working-directory: modules/lib/csyn
        run: ../../../.venv/bin/west update
      - name: Install Zephyr Python requirements
        run: |
          .venv/bin/pip install -r zephyr/scripts/requirements.txt
      - name: Twister tests
        run: make -C modules/lib/csyn test-zephyr ZEPHYR_BASE="${GITHUB_WORKSPACE}/zephyr" PYTHON="${GITHUB_WORKSPACE}/.venv/bin/python"
